[package]
name = "mustawfi-keystore"
description = "The OS secure store of the Windows app (ADR-0022): the device credential and the session token in Windows Credential Manager."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
keyring-core = "1.0.0"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
# Without the default `search` feature, which only adds `regex`.
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
